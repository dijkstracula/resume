# ── Experience ─────────────────────────────────────────────────────────────────
experience:
  - date: "2025–curr."
    org: Semgrep
    location: "Seattle, WA"
    role: "Staff Software Engineer, Program Analysis"
    body: >-
      Performance lead for Semgrep's static analysis engine,
      improving median and tail scan times by 3× and reducing the
      MCP server's latency by over 4×. Led the migration to
      Multicore OCaml, enabling fine-grain parallelism
      improvements. Maintained Semgrep's forked OCaml compiler.

  - date: "2021–2025"
    org: The University of Texas
    location: "Austin, TX"
    role: "Graduate Research Assistant, Department of Computer Science"
    body: >-
      Researched systems applications of lightweight formal methods.
      Verified crash consistency of a persistent memory filesystem.
      Mechanised validating an optimised Paxos implementation against
      its formal spec.

  - date: "2019–2021"
    org: Independent Consultant
    preamble: >-
      Took a break from corporate life to teach, read research papers,
      and help out on interesting problems:
    body:
      - >-
        At *Microsoft Research*, contributed to a research storage engine
        that combined low-latency ML and dynamic analysis to optimise
        index structure layout. Reduced critical-path latency by 40%.
        Mentored PhD interns.
      - >-
        At *RLCore Technologies*, built reliable and safe systems for
        reinforcement learning-driven industrial control systems.
        Implemented property-based testing and record/replay debugging
        frameworks for RL agents.
      - >-
        At *The University of Toronto* and *MacEwan University*, developed
        and taught undergrad CS courses.

  - date: "2018–2019"
    org: Apple
    location: "Cupertino, CA"
    role: Systems Software Engineer
    body: >-
      Developed high-performance GPU simulators modeling in-development
      SoCs, reproducing functional behaviour at interactive framerates,
      allowing developers to start programming before tapeout.

  - date: "2017–2018"
    org: Fauna
    location: "San Francisco, CA"
    role: Senior Software Engineer
    body: >-
      Developed Fauna's strongly consistent, distributed database.
      Built a greybox fault injection tester to verify safety properties
      and maintain development velocity. Mentored engineers new to Scala
      and JVM concurrency.

  - date: "2014–2017"
    org: Fastly
    location: "San Francisco, CA"
    role: Senior Software Engineer
    body: >-
      Maintained Fastly's reverse HTTP proxy and cache. Led development
      of a sandboxing dynamic analysis runtime for the Fastly software
      stack, atop which the compiler, API, and security teams built
      custom analyzers.

  - date: "2012–2014"
    org: Twitter
    location: "San Francisco, CA"
    role: Software Engineer II
    body: >-
      Extended Twitter's Ruby and Java runtimes, improving the GC, JIT,
      and perf analysis tooling. Collaborated with service owners to
      diagnose performance issues. Maintained systems for antispam
      classification and actioning.

